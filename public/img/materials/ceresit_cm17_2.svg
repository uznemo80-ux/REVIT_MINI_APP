<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cBg)"/>

  <text x="400" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1">CERESIT CM 17 — ELASTIK S1 MONTAJ TIZIMI</text>
  <text x="400" y="88" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">Issiq pol va katta formatli kafel uchun deformatsion qatlam</text>

  <!-- Layers Diagram -->
  <g transform="translate(150, 140)">
    <!-- Layer 1: Tile (Top) -->
    <rect x="0" y="0" width="500" height="50" rx="4" fill="url(#tileGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="250" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#1e293b">1. Katta formatli Keramogranit (60x120 sm)</text>

    <!-- Layer 2: Ceresit CM 17 Elastic Glue (Middle) -->
    <g transform="translate(0, 70)">
      <rect width="500" height="60" rx="4" fill="url(#glueGrad)" stroke="#ca8a04" stroke-width="1.5"/>
      <!-- Comb/trowel pattern -->
      <path d="M 0,20 Q 25,0 50,20 Q 75,40 100,20 Q 125,0 150,20 Q 175,40 200,20 Q 225,0 250,20 Q 275,40 300,20 Q 325,0 350,20 Q 375,40 400,20 Q 425,0 450,20 Q 475,40 500,20" fill="none" stroke="#713f12" stroke-width="2" opacity="0.4"/>
      <text x="250" y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#422006">2. Ceresit CM 17 Super Flexible (S1 Elastik Yelim)</text>
    </g>

    <!-- Layer 3: Warm Floor Screed / Subfloor (Bottom) -->
    <g transform="translate(0, 150)">
      <rect width="500" height="80" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <!-- Heating cable representation -->
      <path d="M 30,40 L 100,40 L 100,60 L 200,60 L 200,40 L 300,40 L 300,60 L 400,60 L 400,40 L 470,40" fill="none" stroke="#ef4444" stroke-width="4"/>
      <text x="250" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#f8fafc">3. Issiq pol sathi (Styajka + Isitish kabeli)</text>
    </g>

    <!-- Deformable indicator bracket -->
    <path d="M 520,70 L 535,70 L 535,130 L 520,130" fill="none" stroke="#eab308" stroke-width="2"/>
    <text x="545" y="105" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#eab308">S1 Kompensatsiya (≥ 2.5 mm)</text>
  </g>

  <!-- Technical badges footer -->
  <g transform="translate(100, 420)">
    <rect width="600" height="110" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(40, 25)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Yelim sinfi:</text>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#eab308">C2 TE S1</text>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">EN 12004 Yevropa standarti</text>
    </g>

    <g transform="translate(240, 25)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Harorat chidami:</text>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#22c55e">-50°C dan +70°C gacha</text>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Sovuq va issiqqa 100% chidamli</text>
    </g>

    <g transform="translate(440, 25)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Ochiq vaqt (Open time):</text>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#38bdf8">30 daqiqa</text>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Usta uchun qulay tuzatish</text>
    </g>
  </g>
</svg>