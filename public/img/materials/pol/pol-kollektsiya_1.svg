<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="objGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect width="600" height="450" fill="url(#grid)" />

  <!-- Outer frame border -->
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(40, 42)">
    <rect width="130" height="26" rx="13" fill="#06b6d4" opacity="0.2"/>
    <text x="65" y="17" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ VERIFIED FLOOR</text>
  </g>
  <g transform="translate(420, 42)">
    <rect width="140" height="26" rx="13" fill="rgba(255,255,255,0.08)"/>
    <text x="70" y="17" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FOTO №1 / 3</text>
  </g>

  <!-- Center Graphic -->
  <g transform="translate(300, 215)">
    <!-- Shadow -->
    <ellipse cx="0" cy="95" rx="140" ry="24" fill="rgba(0,0,0,0.4)" filter="blur(8px)"/>

    
      <!-- Perspective 3D Flooring Planks / Tiles -->
      <polygon points="-140,-20 -20,-70 140,-20 20,30" fill="#cffafe" opacity="0.95"/>
      <polygon points="20,30 140,-20 140,25 20,75" fill="#0e7490" opacity="0.9"/>
      <polygon points="-140,-20 20,30 20,75 -140,25" fill="#0e7490" opacity="0.75"/>
      <!-- Interlocking plank 2 -->
      <polygon points="-140,35 20,85 140,35 20,-15" fill="#cffafe" opacity="0.4"/>
      <!-- Joint detail lines -->
      <line x1="-140" y1="-20" x2="20" y2="30" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      <line x1="20" y1="30" x2="140" y2="-20" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      <line x1="20" y1="30" x2="20" y2="75" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    
  </g>

  <!-- Bottom Info Panel -->
  <rect x="40" y="340" width="520" height="70" rx="12" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.1)"/>
  <text x="60" y="365" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">коллекция.</text>
  <text x="60" y="385" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">коллекция. • SPC tosh-polimer pol</text>
  <text x="60" y="400" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">POL MAHSULOT KO‘RINIShI — Asosiy pol katalog kartasi</text>
</svg>