<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="objGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect width="600" height="450" fill="url(#grid)" />

  <!-- Outer frame border -->
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(40, 42)">
    <rect width="130" height="26" rx="13" fill="#78350f" opacity="0.2"/>
    <text x="65" y="17" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SXEMATIK RASM</text>
  </g>
  <g transform="translate(420, 42)">
    <rect width="140" height="26" rx="13" fill="rgba(255,255,255,0.08)"/>
    <text x="70" y="17" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SXEMA №2 / 3</text>
  </g>

  <!-- Center Graphic -->
  <g transform="translate(300, 215)">
    <!-- Shadow -->
    <ellipse cx="0" cy="95" rx="140" ry="24" fill="rgba(0,0,0,0.4)" filter="blur(8px)"/>

    
      <!-- Cross Section Layered Diagram -->
      <rect x="-140" y="-75" width="280" height="150" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
      <rect x="-125" y="-60" width="250" height="18" rx="3" fill="#78350f" opacity="0.9"/>
      <rect x="-125" y="-38" width="250" height="16" rx="3" fill="#fed7aa" opacity="0.95"/>
      <rect x="-125" y="-18" width="250" height="60" rx="4" fill="#451a03" opacity="0.85"/>
      <rect x="-125" y="46" width="250" height="16" rx="3" fill="#334155" opacity="0.9"/>
      <text x="0" y="-47" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HIMOYALOVCHI DIAMOND WEAR LAYER (AC5 / 33 SINF)</text>
      <text x="0" y="-26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DEKORATIV ULTRA-HD NAQSH QATLAMI</text>
      <text x="0" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">MUSTAHKAM HDF / SPC ZICH YADRO (AQUASTOP)</text>
      <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AKUSTIK KOMPENSATSIYA VA BARQARORLIK QATLAMI</text>
    
  </g>

  <!-- Bottom Info Panel -->
  <rect x="40" y="340" width="520" height="70" rx="12" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.1)"/>
  <text x="60" y="365" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">ДПК плитка</text>
  <text x="60" y="385" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">ДПК плитка • DPK pol qoplamasi</text>
  <text x="60" y="400" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">STRUKTURA VA QATLAMLAR KESIMI — Himoya va HDF/SPC qatlamlari</text>
</svg>