<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Cement Board Texture -->
    <pattern id="cementGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#4a5568"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d3748" stroke-width="0.75" opacity="0.6"/>
      <circle cx="5" cy="5" r="0.8" fill="#718096" opacity="0.5"/>
      <circle cx="15" cy="12" r="1.2" fill="#2d3748" opacity="0.4"/>
      <circle cx="10" cy="18" r="0.7" fill="#a0aec0" opacity="0.3"/>
    </pattern>
    <!-- Fiberglass Mesh Overlay -->
    <pattern id="meshOverlay" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#3182ce" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="knaufBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005691"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Studio Card -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle ambient glow -->
  <circle cx="400" cy="300" r="280" fill="#0284c7" opacity="0.06"/>

  <!-- Cement Board Perspective Representation -->
  <g filter="url(#dropShadow)" transform="translate(100, 70)">
    <!-- 3D Edge / Thickness -->
    <polygon points="600,60 618,72 618,412 600,400" fill="#1a202c"/>
    <polygon points="20,400 600,400 618,412 38,412" fill="#2d3748"/>

    <!-- Main Board Face -->
    <rect x="20" y="60" width="580" height="340" rx="4" fill="url(#boardGrad)"/>
    <rect x="20" y="60" width="580" height="340" rx="4" fill="url(#cementGrid)"/>
    <rect x="20" y="60" width="580" height="340" rx="4" fill="url(#meshOverlay)"/>
    <rect x="20" y="60" width="580" height="340" rx="4" fill="none" stroke="#718096" stroke-width="1.5" opacity="0.6"/>

    <!-- Brand Header Ribbon -->
    <rect x="40" y="80" width="220" height="42" rx="4" fill="url(#knaufBlue)"/>
    <text x="55" y="108" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">KNAUF</text>
    <text x="160" y="108" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#bae6fd" letter-spacing="1">ORIGINAL</text>

    <!-- Product Title Badge -->
    <text x="40" y="170" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">AQUAPANEL®</text>
    <text x="40" y="202" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#38bdf8" letter-spacing="1.5">INDOOR / СЕМЕНТНАЯ ПЛИТА</text>

    <!-- Key Product Specs Box -->
    <g transform="translate(40, 230)">
      <rect width="540" height="150" rx="6" fill="#1e293b" opacity="0.9"/>
      <rect width="540" height="150" rx="6" fill="none" stroke="#334155" stroke-width="1"/>

      <!-- Spec 1: 100% Water Resistant -->
      <g transform="translate(20, 20)">
        <circle cx="20" cy="20" r="16" fill="#0284c7" opacity="0.2"/>
        <text x="20" y="26" text-anchor="middle" font-size="18">💧</text>
        <text x="48" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">100% Suvga Chidamli</text>
        <text x="48" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Basseyn, dush va xamam uchun</text>
      </g>

      <!-- Spec 2: Thickness & Dimensions -->
      <g transform="translate(280, 20)">
        <circle cx="20" cy="20" r="16" fill="#10b981" opacity="0.2"/>
        <text x="20" y="26" text-anchor="middle" font-size="18">📏</text>
        <text x="48" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">12.5 mm Qalinlik</text>
        <text x="48" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Format: 1200 x 900 mm / 15 kg</text>
      </g>

      <!-- Spec 3: Load capacity -->
      <g transform="translate(20, 80)">
        <circle cx="20" cy="20" r="16" fill="#f59e0b" opacity="0.2"/>
        <text x="20" y="26" text-anchor="middle" font-size="18">🧱</text>
        <text x="48" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">50 kg/m² Kafel Ko'taradi</text>
        <text x="48" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Og'ir keramogranit va tosh uchun</text>
      </g>

      <!-- Spec 4: Fire Rating -->
      <g transform="translate(280, 80)">
        <circle cx="20" cy="20" r="16" fill="#ef4444" opacity="0.2"/>
        <text x="20" y="26" text-anchor="middle" font-size="18">🔥</text>
        <text x="48" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">KM0 / NG Sinflari</text>
        <text x="48" y="34" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Mutlaqo yonmaydigan material</text>
      </g>
    </g>

    <!-- Corner authentic stamp badge -->
    <g transform="translate(480, 75)">
      <circle cx="45" cy="45" r="35" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <text x="45" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1">CEMENT</text>
      <text x="45" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#38bdf8">BOARD</text>
      <text x="45" y="65" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#bae6fd">12.5 MM</text>
    </g>
  </g>
</svg>