<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#gBg)"/>

  <!-- Title -->
  <text x="400" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1">GEBERIT SIGMA — BOSHQARUV TUGMASI</text>
  <text x="400" y="98" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8">2 rejimli suv tejovchi pnevmatik klavisha (3L / 6L)</text>

  <!-- Flush Plate 3D view -->
  <g filter="url(#plateShadow)" transform="translate(250, 160)">
    <!-- Plate base -->
    <rect width="300" height="190" rx="8" fill="url(#plateGrad)" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Small Flush Button (3 Liters) -->
    <g transform="translate(50, 45)">
      <ellipse cx="40" cy="50" rx="35" ry="45" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <ellipse cx="40" cy="50" rx="28" ry="38" fill="#e2e8f0"/>
      <text x="40" y="55" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#475569">3 L</text>
    </g>

    <!-- Large Flush Button (6 Liters) -->
    <g transform="translate(150, 35)">
      <ellipse cx="55" cy="60" rx="48" ry="55" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <ellipse cx="55" cy="60" rx="40" ry="47" fill="#e2e8f0"/>
      <text x="55" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#475569">6 L</text>
    </g>

    <!-- Geberit Logo text on plate -->
    <text x="150" y="170" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="2">GEBERIT</text>
  </g>

  <!-- Spec info cards -->
  <g transform="translate(150, 430)">
    <rect width="500" height="100" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="30" y="40" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Suv tejash texnologiyasi:</text>
    <text x="30" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Kichik yuvish 3 litr, to'liq yuvish 6 litr. Suv sarfini 50% gacha kamaytiradi.</text>
    <text x="30" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Asosiy ramkaga asbob-uskunasiz (Easy-fix) o'rnatiladi.</text>
  </g>
</svg>