<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="objGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect width="600" height="450" fill="url(#grid)" />

  <!-- Outer frame border -->
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Badges -->
  <g transform="translate(40, 42)">
    <rect width="130" height="26" rx="13" fill="#ef4444" opacity="0.2"/>
    <text x="65" y="17" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ VERIFIED ASSET</text>
  </g>
  <g transform="translate(420, 42)">
    <rect width="140" height="26" rx="13" fill="rgba(255,255,255,0.08)"/>
    <text x="70" y="17" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FOTO №3 / 3</text>
  </g>

  <!-- Isometric / Product Center Graphic -->
  <g transform="translate(300, 215)">
    <!-- Shadow -->
    <ellipse cx="0" cy="95" rx="140" ry="24" fill="rgba(0,0,0,0.4)" filter="blur(8px)"/>

    
      <!-- Installation / Application Assembly Schematic -->
      <rect x="-140" y="-80" width="280" height="160" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)"/>
      <line x1="-100" y1="-80" x2="-100" y2="80" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>
      <line x1="100" y1="-80" x2="100" y2="80" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>
      <rect x="-70" y="-50" width="140" height="100" rx="6" fill="#fecaca" opacity="0.85" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="-70" cy="-25" r="5" fill="#ef4444"/>
      <circle cx="-70" cy="25" r="5" fill="#ef4444"/>
      <circle cx="70" cy="-25" r="5" fill="#ef4444"/>
      <circle cx="70" cy="25" r="5" fill="#ef4444"/>
      <text x="0" y="5" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">MONTAJ SxEMASI</text>
      <text x="0" y="24" fill="#334155" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Karkas / Yelimli qotirish</text>
    
  </g>

  <!-- Bottom Info Panel -->
  <rect x="40" y="340" width="520" height="70" rx="12" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.1)"/>
  <text x="60" y="365" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">Металлический сайдинг</text>
  <text x="60" y="385" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Himoyalovchi fasad saydingi • Fasad materiallari</text>
  <text x="60" y="400" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">MONTAJ VA QO‘LLANISH — O‘rnatish texnologiyasi</text>
</svg>