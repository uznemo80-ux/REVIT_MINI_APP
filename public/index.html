<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0a0a0f">
  <title>YOSHUZBEKK Academy</title>

  <link rel="stylesheet" href="/style.css?v=40">

<body>

    </div>

</html>
