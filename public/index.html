  <meta name="theme-color" content="#0a0a0a">
  <title>YOSHUZBEKK</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div id="app">
    <div class="splash-screen">
      <div class="splash-name">YOSHUZBEKK</div>
      <div class="splash-loader"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Ochilish animatsiyasi: ilova ustida ~1.4 soniya, keyin yo'qoladi (bosilsa darhol). #app ichida emas,
       shuning uchun ilovaning birinchi render'i uni o'chirib yubormaydi. -->
  <div id="brand-intro" aria-hidden="true">
    <div class="bi-word">
      <span>Y</span><span>O</span><span>S</span><span>H</span><span>U</span><span>Z</span><span>B</span><span>E</span><span>K</span><span>K</span>
    </div>
    <div class="bi-line"></div>
    <div class="bi-sub">Arxitektura · Interyer dizayn · Revit</div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('brand-intro');
      if (!el) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var done = false;
      function hide() {
        if (done) return; done = true;
        el.classList.add('bi-out');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }
      el.addEventListener('click', hide);
      setTimeout(hide, reduce ? 0 : 1450);
    })();
  </script>

  <script src="/i18n.js?v=1"></script>
  <script src="/app.js?v=95"></script>
  <script src="/equipmentI18n.js?v=1"></script>
  <script src="/equipmentUi.js?v=2"></script>
  <script src="/equipmentAdminUi.js?v=1"></script>
</body>
</html>
